services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.test.local
    domainname: test.local
    ports:
      - "1025:25"    # SMTP
      - "1143:143"   # IMAP
    environment:
      # Disable all production features we don't need
      - PERMIT_DOCKER=network
      - ONE_DIR=1
      - ENABLE_CLAMAV=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_AMAVIS=0
      - SSL_TYPE=
      - SUPERVISOR_LOGLEVEL=warn
      # Allow plaintext auth (test only)
      - DOVECOT_AUTH_BIND=no
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - ./config/:/tmp/docker-mailserver/
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q ':25' && ss -tlnp | grep -q ':143'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  seed:
    build: ./seed
    container_name: mail-seed
    depends_on:
      mailserver:
        condition: service_healthy
    environment:
      - MAIL_HOST=mailserver
      - MAIL_DOMAIN=test.local
      - SMTP_PORT=25
      - IMAP_PORT=143

  webmail:
    build: ./snappymail
    container_name: webmail
    ports:
      - "8888:8888"
    volumes:
      - snappymail_data:/var/lib/snappymail
    depends_on:
      mailserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  maildata:
  mailstate:
  snappymail_data:
