# B4iGO Email Agent - Full Demo Stack
#
# Combines:
#   - smtp-imap-test mail server + webmail (bundled in demo/smtp-imap-test/)
#   - Host Ollama (expects qwen3:8b to be available via `ollama pull qwen3:8b`)
#   - account manager (auth + linked accounts) - Dockerfile in account_manager/
#   - scheduler (polls account-manager, hands off to ai-service) - Dockerfile in scheduler/
#   - ai-service (parses email content via Ollama) - Dockerfile in ai_service/
#   - b4igo backend (Flask API + confirmation queue) - Dockerfile in backend/
#   - b4igo frontend (React/Vite) - Dockerfile in frontend/
#   - admin panel (operations UI) - Dockerfile in admin_panel/
#   - bootstrap (one-shot: links the demo IMAP mailbox so polling kicks off)
#
# Mailboxes start empty. Use the admin panel at :5400 to send test emails.
#
# Usage:
#   cd demo/
#   ./setup.sh          # generates mail accounts config, then starts everything
#   ./setup.sh -d       # same but detached
#
# URLs:
#   Frontend:    http://localhost:5173  (login: user / password)
#   Webmail:     http://localhost:8888  (login: alice@test.local / password123)
#   Backend:     http://localhost:5000/api/health
#   Admin panel: http://localhost:5400  (default password: admin; localhost-bound only)

services:
  # ──────────────────────────────────────────────
  # Mail server (docker-mailserver)
  # ──────────────────────────────────────────────
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.test.local
    domainname: test.local
    ports:
      - "1025:25"
      - "1143:143"
    environment:
      - PERMIT_DOCKER=network
      - ONE_DIR=1
      - ENABLE_CLAMAV=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_AMAVIS=0
      - SSL_TYPE=
      - SUPERVISOR_LOGLEVEL=warn
      - DOVECOT_AUTH_BIND=no
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - ./smtp-imap-test/config/:/tmp/docker-mailserver/
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q ':25' && ss -tlnp | grep -q ':143'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Webmail UI (SnappyMail)
  # ──────────────────────────────────────────────
  webmail:
    build: ./smtp-imap-test/snappymail
    container_name: webmail
    ports:
      - "8888:8888"
    volumes:
      - snappymail_data:/var/lib/snappymail
    depends_on:
      mailserver:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # B4iGO Account Manager (auth + linked accounts)
  # ──────────────────────────────────────────────
  account-manager:
    build:
      context: ..
      dockerfile: account_manager/Dockerfile
    container_name: b4igo-account-manager
    ports:
      - "5100:5100"
    environment:
      - B4IGO_ACCOUNT_MANAGER_PORT=5100
      - B4IGO_BACKEND_GRAPHQL_URL=https://gatewayservice-test-684919379591.us-central1.run.app/query/
      - B4IGO_SCHEDULER_URL=http://scheduler:5200
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5100/api/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # B4iGO Backend (Flask API)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: b4igo-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - B4IGO_ADMIN_TOKEN=${B4IGO_ADMIN_TOKEN:-demo-admin-token}
      - B4IGO_ACCOUNT_MANAGER_URL=http://account-manager:5100
      - B4IGO_BACKEND_URL=http://localhost:5000
      - B4IGO_AI_SERVICE_URL=http://ai-service:5300
      # Browser origins allowed to make credentialed CORS requests. The demo
      # frontend is served at localhost:5173. Add a chrome-extension://<id>
      # origin here if driving the backend from the browser extension.
      - B4IGO_CORS_ORIGINS=http://localhost:5173
      - B4IGO_VAULT_BACKEND=api
      - B4IGO_API_BASE_URL=https://gatewayservice-test-684919379591.us-central1.run.app/query/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mailserver:
        condition: service_healthy
      account-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # B4iGO Frontend (React/Vite dev server)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: b4igo-frontend
    ports:
      - "5173:5173"
    environment:
      # Backend /api base the browser app talks to (see frontend/src/API/Auth.ts).
      - VITE_BACKEND_URL=http://localhost:5000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # AI Service (text/attachment → parsed entries)
  #
  # Connects to Ollama using host gateway.
  # ──────────────────────────────────────────────
  ai-service:
    build:
      context: ..
      dockerfile: ai_service/Dockerfile
    container_name: ai-service
    ports:
      - "5300:5300"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - AI_SERVICE_PORT=5300
      - BACKEND_URL=http://backend:5000
      - PARSER_MODEL=${PARSER_MODEL:-}
      - RERANKER_MODEL=${RERANKER_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Redis (queues for the scheduler)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: b4igo-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Scheduler (polls account-manager for new mail, hands off to ai-service)
  # ──────────────────────────────────────────────
  scheduler:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
    container_name: b4igo-scheduler
    ports:
      - "5200:5200"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - B4IGO_ACCOUNT_MANAGER_URL=http://account-manager:5100
      - B4IGO_AI_SERVICE_URL=http://ai-service:5300
      - POLL_INTERVAL_SECONDS=5
      - QUEUE_INTERVAL_SECONDS=5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      account-manager:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Bootstrap (one-shot): link the demo IMAP mailbox and register it with the
  # scheduler so polling kicks off. Stand-in for what a real user would do via
  # the "Link account" frontend flow. Idempotent - safe to re-run.
  # ──────────────────────────────────────────────
  bootstrap:
    build: ./bootstrap
    container_name: b4igo-bootstrap
    environment:
      - ACCOUNT_MANAGER_URL=http://account-manager:5100
      - SCHEDULER_URL=http://scheduler:5200
      - DEMO_USER=user
      - IMAP_EMAIL=alice@test.local
      - IMAP_PASSWORD=password123
      - IMAP_HOST=mailserver
      - IMAP_PORT=143
    depends_on:
      account-manager:
        condition: service_healthy
      scheduler:
        condition: service_started
    restart: "no"

  # ──────────────────────────────────────────────
  # B4iGO Admin Panel (demo-only operations UI)
  #
  # Mounts the Docker socket so it can show logs, exec into containers,
  # and start/stop services. Bound to 127.0.0.1 only so the socket isn't
  # ever reachable beyond the host running the demo.
  # ──────────────────────────────────────────────
  admin-panel:
    build:
      context: ..
      dockerfile: admin_panel/Dockerfile
    container_name: b4igo-admin-panel
    ports:
      - "127.0.0.1:5400:5400"
    environment:
      - B4IGO_ADMIN_PANEL_PASSWORD=${B4IGO_ADMIN_PANEL_PASSWORD:-admin}
      - B4IGO_ADMIN_PANEL_SECRET=${B4IGO_ADMIN_PANEL_SECRET:-}
      - B4IGO_ADMIN_TOKEN=${B4IGO_ADMIN_TOKEN:-demo-admin-token}
      - B4IGO_BACKEND_URL=http://backend:5000
      - B4IGO_AI_SERVICE_URL=http://ai-service:5300
      - MAIL_HOST=mailserver
      - MAIL_DOMAIN=test.local
      - MAIL_SMTP_PORT=25
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  maildata:
  mailstate:
  snappymail_data:
