# B4iGO Email Agent - Full Demo Stack
#
# Combines:
#   - smtp-imap-test mail server + seeded emails + webmail (bundled in demo/smtp-imap-test/)
#   - Host Ollama (expects qwen3:8b to be available via `ollama pull qwen3:8b`)
#   - b4igo backend (Flask API) — Dockerfile in backend/
#   - b4igo frontend (React/Vite) — Dockerfile in frontend/
#   - account manager (auth + linked accounts) — Dockerfile in account-manager/
#   - mail ingest (IMAP → AI pipeline → backend) — Dockerfile in mail_ingest/
#
# Usage:
#   cd demo/
#   ./setup.sh          # generates mail accounts config, then starts everything
#   ./setup.sh -d       # same but detached
#
# URLs:
#   Frontend:  http://localhost:5173  (login: user / password)
#   Webmail:   http://localhost:8888  (login: alice@test.local / password123)
#   Backend:   http://localhost:5000/api/health

services:
  #TODO temp solution to get everything working with localhost
  net-hub:
    image: alpine:latest
    command: tail -f /dev/null
    container_name: b4igo-net-hub
    ports:
      - "5000:5000"   # Backend
      - "5100:5100"   # Account-Manager
      - "5173:5173"   # Frontend
      - "5200:5200"   # Scheduler
      - "5300:5300"   # ai_service
      - "6379:6379"   # Redis
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Mail server (docker-mailserver)
  # ──────────────────────────────────────────────
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.test.local
    domainname: test.local
    ports:
      - "1025:25"
      - "1143:143"
    environment:
      - PERMIT_DOCKER=network
      - ONE_DIR=1
      - ENABLE_CLAMAV=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_AMAVIS=0
      - SSL_TYPE=
      - SUPERVISOR_LOGLEVEL=warn
      - DOVECOT_AUTH_BIND=no
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - ./smtp-imap-test/config/:/tmp/docker-mailserver/
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q ':25' && ss -tlnp | grep -q ':143'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Seed mailboxes with test emails
  # ──────────────────────────────────────────────
  seed:
    build: ./smtp-imap-test/seed
    container_name: mail-seed
    depends_on:
      mailserver:
        condition: service_healthy
    environment:
      - MAIL_HOST=mailserver
      - MAIL_DOMAIN=test.local
      - SMTP_PORT=25
      - IMAP_PORT=143

  # ──────────────────────────────────────────────
  # Webmail UI (SnappyMail)
  # ──────────────────────────────────────────────
  webmail:
    build: ./smtp-imap-test/snappymail
    container_name: webmail
    ports:
      - "8888:8888"
    volumes:
      - snappymail_data:/var/lib/snappymail
    depends_on:
      mailserver:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # B4iGO Account Manager (auth + linked accounts)
  # ──────────────────────────────────────────────
  account-manager:
    build:
      context: ..
      dockerfile: account-manager/Dockerfile
    container_name: b4igo-account-manager
    #ports:
    #  - "5100:5100"
    environment:
      - B4IGO_ACCOUNT_MANAGER_PORT=5100
      - B4IGO_ACCOUNT_MANAGER_PUBLIC_URL=http://localhost:5100
      - B4IGO_BACKEND_GRAPHQL_URL=https://gatewayservice-test-684919379591.us-central1.run.app/query/
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5100/api/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    network_mode: "service:net-hub" #TODO
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Redis Queue (Required by Scheduler)
  # ──────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: redis
    #ports:
    #  - "6379:6379"
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Scheduler Service
  # ──────────────────────────────────────────────
  scheduler:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
    container_name: b4igo-scheduler
    network_mode: "service:net-hub" #TODO
    environment:
      - B4IGO_AI_SERVICE_URL=http://localhost:5300
      - B4IGO_ACCOUNT_MANAGER_URL=http://localhost:5100
      - REDIS_HOST=localhost
    #ports:
    #  - "5200:5200"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5200/api/health')\"" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      redis:
        condition: service_started
      account-manager:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # AI Pipeline Service
  # ──────────────────────────────────────────────
  ai_service:
    build:
      context: ..
      dockerfile: ai_service/Dockerfile
    container_name: b4igo-ai_service
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5300/api/health')\"" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    #ports:
    #  - "5300:5300"
    environment:
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5300
      - B4IGO_BACKEND_URL=http://localhost:5000
    restart: unless-stopped
    network_mode: "service:net-hub" # TODO: temp to get it working for a demo, remove from all and change hardcoded urls

  # ──────────────────────────────────────────────
  # B4iGO Backend (Flask API)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: b4igo-backend
    #ports:
    #  - "5000:5000"
    environment:
      - FLASK_ENV=development
      - B4IGO_ACCOUNT_MANAGER_URL=http://localhost:5100
      - B4IGO_AI_SERVICE_URL=http://localhost:5300
      - B4IGO_FRONTEND_URL=http://localhost:5173
      - B4IGO_BACKEND_URL=http://localhost:5000
    depends_on:
      mailserver:
        condition: service_healthy
      account-manager:
        condition: service_healthy
#      ai_service:
#        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    network_mode: "service:net-hub" #TODO
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # B4iGO Frontend (React/Vite dev server)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: b4igo-frontend
    #ports:
    #  - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:5000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    network_mode: "service:net-hub" #TODO


  # ──────────────────────────────────────────────
  # Mail Ingest (IMAP → AI pipeline → Backend API)
  # ──────────────────────────────────────────────
  mail_ingest:
    build:
      context: ..
      dockerfile: mail_ingest/Dockerfile
    container_name: mail_ingest
    # Host network so we can reach Ollama on localhost:11434
    # (Ollama binds to 127.0.0.1 by default)
    network_mode: host
    environment:
      - IMAP_HOST=localhost
      - IMAP_PORT=1143
      - IMAP_USER=alice@test.local
      - IMAP_PASS=password123
      - B4IGO_BACKEND_URL=http://localhost:5000
      - BACKEND_USER=user
      - OLLAMA_HOST=http://localhost:11434
      - POLL_INTERVAL=0  # run once; set >0 to poll
    depends_on:
      seed:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

volumes:
  maildata:
  mailstate:
  snappymail_data:
